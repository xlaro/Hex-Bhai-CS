name: Build and Deploy Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins & Generate Index
        run: |
          chmod +x gradlew
          ./gradlew make

      - name: Deploy to GitHub Pages / Docs
        run: |
          mkdir -p docs
          cp build/*.cs3 docs/ 2>/dev/null || true
          cp build/*.json docs/ 2>/dev/null || true
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git commit -m "Updated plugins and plugins.json index" || exit 0
          git push
