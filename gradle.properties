org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Jitpack has to cold-build com.github.recloudstream:gradle on demand (no
# tagged releases), which can take well over a minute. Gradle's default
# HTTP timeouts are too short and fail with "Read timed out" before that
# build finishes, so raise them here.
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.https.socketTimeout=180000
systemProp.https.connectionTimeout=180000
